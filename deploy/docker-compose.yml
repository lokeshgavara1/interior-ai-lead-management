# VPS deployment: the app behind Caddy (automatic HTTPS via Let's Encrypt).
# Usage (on the server, from this folder):
#   1. put backend/.env in place (see docs/DEPLOYMENT.md)
#   2. set DOMAIN in deploy/.env, e.g.  DOMAIN=leads.example.com
#   3. docker compose up -d --build
services:
  app:
    build: ../backend
    env_file: ../backend/.env
    restart: unless-stopped
    expose:
      - "3000"
    # Optional: mount a Google service-account key and set
    # GOOGLE_SERVICE_ACCOUNT_FILE=/secrets/google-sa.json in backend/.env
    # volumes:
    #   - ./secrets/google-sa.json:/secrets/google-sa.json:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
